name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Dependency repositories are installed editable from their checkouts, so CI works before any release.
      - run: python -m pip install -e ./usage
      - run: python -m pip install -e ".[dev]" --no-deps
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m mypy
      # Offline tests only: no API key is configured in CI and none is needed.
      - run: python -m pytest
        env:
          JEV_JUDGE: fake
