[project]
name = "jev-toolkit-usage"
version = "0.1.0"
description = "A judgement-model layer (currently TypeSafe Jev) around generative LLMs: typed decisions, logged and swappable, plus a model/effort router for Claude Code."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eric Ährlund" }]
requires-python = ">=3.11"
keywords = ["llm", "judge", "router", "claude-code", "typed-output", "typesafe"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    # Pinned: the SDK is pre-1.0 and has changed question types between minor versions.
    "typesafe-sdk==0.7.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/Wrenik/Jev-toolkit-usage"
Issues = "https://github.com/Wrenik/Jev-toolkit-usage/issues"
Changelog = "https://github.com/Wrenik/Jev-toolkit-usage/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls the real Jev API (costs a fraction of a cent; needs TYPESAFE_API_KEY)"]
addopts = "-m 'not live'"

[tool.setuptools.package-data]
jev_core = ["py.typed"]
jev_router = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
# E501: long docstring/comment lines are fine here; B023: the closures are called immediately; UP007: Union aliases are kept explicit.
ignore = ["E501", "B023", "UP007"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
